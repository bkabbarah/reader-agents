<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0E1220; color: #E8E4D8; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #E0AF52; } a:hover { color: #F0C878; }
    text { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  </style>
</helmet>
<div style="width: 1240px; height: 430px; background: #0E1220; padding: 16px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start">
  <div style="background: #171C2E; border: 1px solid #272E48; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 15px">Alternate B · chapter columns (time runs left → right, then down)</div>
    <svg viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="chapter columns sketch">
      <defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B18FE8"></path></marker></defs>
      <g fill="none" stroke="#272E48"><rect x="10" y="30" width="100" height="250" rx="6"></rect><rect x="130" y="30" width="100" height="250" rx="6"></rect><rect x="250" y="30" width="100" height="250" rx="6"></rect><rect x="370" y="30" width="100" height="250" rx="6"></rect><rect x="490" y="30" width="100" height="250" rx="6"></rect></g>
      <g font-size="10" fill="#6A7086" text-anchor="middle"><text x="60" y="22">Ch. 1</text><text x="180" y="22">Ch. 2</text><text x="300" y="22">Ch. 3</text><text x="420" y="22">Ch. 4</text><text x="540" y="22">Ch. 5</text></g>
      <g fill="#3A4160">
        <circle cx="60" cy="50" r="3.5"></circle><circle cx="60" cy="70" r="3.5"></circle><circle cx="60" cy="90" r="3.5"></circle><circle cx="60" cy="130" r="3.5"></circle><circle cx="60" cy="170" r="3.5"></circle><circle cx="60" cy="190" r="3.5"></circle>
        <circle cx="180" cy="50" r="3.5"></circle><circle cx="180" cy="70" r="3.5"></circle><circle cx="180" cy="90" r="3.5"></circle><circle cx="180" cy="110" r="3.5"></circle><circle cx="180" cy="150" r="3.5"></circle>
        <circle cx="300" cy="50" r="3.5"></circle><circle cx="300" cy="70" r="3.5"></circle><circle cx="300" cy="130" r="3.5"></circle><circle cx="300" cy="170" r="3.5"></circle><circle cx="300" cy="210" r="3.5"></circle>
        <circle cx="420" cy="50" r="3.5"></circle><circle cx="420" cy="90" r="3.5"></circle><circle cx="420" cy="130" r="3.5"></circle>
        <circle cx="540" cy="50" r="3.5"></circle><circle cx="540" cy="110" r="3.5"></circle><circle cx="540" cy="170" r="3.5"></circle>
      </g>
      <g stroke="#B18FE8" stroke-width="1.6" fill="none">
        <path d="M60 106 C 60 118, 60 118, 60 126" marker-end="url(#arrB)"></path>
        <path d="M60 164 C 60 130, 60 120, 60 116" marker-end="url(#arrB)"></path>
        <path d="M300 124 C 200 124, 120 112, 68 112" marker-end="url(#arrB)"></path>
        <path d="M540 164 C 400 150, 200 130, 68 114" marker-end="url(#arrB)"></path>
      </g>
      <g fill="#B18FE8"><circle cx="60" cy="130" r="4.5"></circle><circle cx="60" cy="170" r="4.5"></circle><circle cx="300" cy="130" r="4.5"></circle><circle cx="540" cy="170" r="4.5"></circle></g>
      <circle cx="60" cy="110" r="7" fill="#E0AF52" stroke="#E8E4D8" stroke-width="1.5"></circle>
      <text x="76" y="114" font-size="10" fill="#E0AF52" font-weight="600">Thm 1.3.13</text>
      <text x="620" y="60" font-size="10" fill="#989DB0">Trade-off:</text>
      <text x="620" y="76" font-size="9.5" fill="#6A7086">+ chapter structure</text>
      <text x="620" y="90" font-size="9.5" fill="#6A7086">   is explicit</text>
      <text x="620" y="110" font-size="9.5" fill="#6A7086">– long books need</text>
      <text x="620" y="124" font-size="9.5" fill="#6A7086">   scrolling columns</text>
      <text x="620" y="144" font-size="9.5" fill="#6A7086">– arrows cross the</text>
      <text x="620" y="158" font-size="9.5" fill="#6A7086">   whole width</text>
    </svg>
  </div>
  <div style="background: #171C2E; border: 1px solid #272E48; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 15px">Neighbourhood as a directed list</div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">
      <div style="color: #989DB0; font-size: 10px; letter-spacing: 1.5px">USES ↑ EARLIER</div>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #B18FE8">▲</span><span style="border: 1px solid #B18FE8; border-radius: 8px; padding: 4px 10px; color: #E8E4D8">Prop 1.3.14</span><span style="color: #6A7086; font-size: 10.5px">p. 37</span></div>
      <div style="border: 1.6px solid #E0AF52; background: #2C2410; border-radius: 10px; padding: 8px 12px; color: #E0AF52; font-weight: 600">Thm 1.3.13 · p. 36</div>
      <div style="color: #989DB0; font-size: 10px; letter-spacing: 1.5px">USED BY ↓ LATER</div>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #B18FE8">▼</span><span style="border: 1px solid #B18FE8; border-radius: 8px; padding: 4px 10px; color: #E8E4D8">Thm 1.4.14</span><span style="color: #6A7086; font-size: 10.5px">p. 46</span></div>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #B18FE8">▼</span><span style="border: 1px solid #B18FE8; border-radius: 8px; padding: 4px 10px; color: #E8E4D8">Prop 3.4.14</span><span style="color: #6A7086; font-size: 10.5px">p. 201</span></div>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #B18FE8">▼</span><span style="border: 1px solid #B18FE8; border-radius: 8px; padding: 4px 10px; color: #E8E4D8">Prop 3.4.18</span><span style="color: #6A7086; font-size: 10.5px">p. 204</span></div>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #B18FE8">▼</span><span style="border: 1px solid #B18FE8; border-radius: 8px; padding: 4px 10px; color: #E8E4D8">Prop 5.8.6</span><span style="color: #6A7086; font-size: 10.5px">p. 386</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
